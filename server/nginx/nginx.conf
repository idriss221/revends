worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Le corps JSON peut atteindre 2 Mo côté API (express.json limit) : au-delà,
  # nginx renverrait 413 avant même d'atteindre Express.
  client_max_body_size 4m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  upstream revends_api {
    # Noms de service Docker (DNS interne) — JAMAIS d'IP en dur : une IP figée
    # casse l'upstream au moindre changement de sous-réseau réseau ou de scale.
    server api1:4000 max_fails=3 fail_timeout=10s;
    server api2:4000 max_fails=3 fail_timeout=10s;
    server api3:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Schéma réellement vu par le VISITEUR.
  # Derrière un terminateur TLS (Cloudflare Tunnel, load-balancer, Render…),
  # nginx ne parle à l'amont qu'en HTTP : `$scheme` vaudrait toujours `http`,
  # et l'API croirait le site en clair. Les callbacks OAuth (Google exige
  # https) et les cookies `Secure` seraient alors faux. On honorera donc
  # l'entête `X-Forwarded-Proto` fournie par le proxy, quand elle existe.
  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
  }

  server {
    listen 80;
    # HTTPS local (certificat auto-signé) : certaines consoles OAuth (Facebook)
    # n'acceptent une redirection de test qu'en https, même sur localhost.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Security headers — IMPORTANT : tout `location` qui déclare son propre
    # `add_header` ANNULE ceux hérités du niveau serveur (règle nginx), ils
    # doivent donc être RECOPIÉS dans chaque location (assets, index.html…).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS : uniquement ici (ce serveur est en ssl, voir listen 443).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP progressive : script-src limité à 'self' + le hash SHA-256 du SEUL
    # script inline du build (le script anti-flash de index.html) — aucun
    # 'unsafe-inline' : un script injecté est bloqué même si helmet est absent.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pENrTF7Qil4fgIOHt6O9tXh+jhwXNF5TRG7gsrz+EDc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    # Assets VERSIONNÉS par hash (Vite les place dans /assets/) : cache long sûr.
    location ^~ /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      access_log off;
    }

    # Scripts vanilla NON versionnés : suppression du bloc `location ^~ /bureau/`
    # (l'ancienne interface vanilla a été supprimée du build — plus aucun fichier).

    # L'index.html référence des bundles hashés : ne jamais le cacher.
    # (hérite le niveau serveur seulement si AUCUN add_header local — d'où la
    #  répétition complète des en-têtes de sécurité ci-dessous.)
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pENrTF7Qil4fgIOHt6O9tXh+jhwXNF5TRG7gsrz+EDc='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    # Autres assets (images, polices) : cache long.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      access_log off;
    }

    # API proxy
    location /api/ {
      proxy_pass http://revends_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_cache_bypass $http_upgrade;
      # Une instance morte (conteneur arrêté) laisse une IP qui ne répond plus :
      # sans `proxy_connect_timeout`, nginx attend le défaut de 60 s (SYN sans
      # RST) et la requête pend côté client. 2 s suffisent en intra-Docker, et
      # `proxy_next_upstream` rejoue immédiatement sur une instance saine.
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Uploads proxy — `^~` est OBLIGATOIRE : sans lui, la location regex
    # `\.(png|jpg|…)$` ci-dessus (évaluée avant les préfixes simples) capture
    # `/uploads/products/<uuid>.jpg` et nginx tente de servir un fichier local
    # → 404 alors que l'API répond 200. Les photos produits étaient donc
    # invisibles via le site public.
    location ^~ /uploads/ {
      proxy_pass http://revends_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback: all other routes -> index.html (hash routing handled by vanilla app.js)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (not proxied)
    location = /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }
  }
}