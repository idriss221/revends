# Base de données PostgreSQL locale pour le développement ReVends.
# Démarrage :  docker compose up -d   (conteneur revends-postgres, port 127.0.0.1:5433)
services:
  postgres:
    image: postgres:16-alpine
    container_name: revends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revends
      POSTGRES_PASSWORD: StrongDevPassword123
      POSTGRES_DB: revends
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - revends_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revends -d revends"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  revends_pgdata: