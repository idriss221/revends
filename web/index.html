<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Sok2t5JNg8uIAJtdyF1O56INwX5xrdQuV7eXxcINv6w" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ==================================================================
         SEO — Ranga (marketplace seconde main, Sénégal)
         Objectif : être visible sur « ranga » et les requêtes
         friperie / articles d'occasion. On CONSERVE le canonical
         de production (ranga-sn.vercel.app) : un canonical vers vercel.app
         ferait indexer le domaine Vercel à la place du site.
         ================================================================== -->
    <title>Ranga — Friperie en ligne & Articles d'occasion au Sénégal</title>
    <meta
      name="description"
      content="Ranga : la friperie en ligne sénégalaise. Achetez et vendez des articles d'occasion — vêtements, téléphones, chaussures — en toute confiance. Paiement sécurisé, livraison suivie, vendeurs vérifiés."
    />
    <meta
      name="keywords"
      content="ranga, ranga sénégal, friperie en ligne, friperie sénégal, articles d'occasion, seconde main sénégal, marketplace sénégal, vendre en ligne sénégal, acheter pas cher sénégal"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Ranga" />
    <link rel="canonical" href="https://ranga-sn.vercel.app/" />

    <!-- Open Graph (Facebook, X/Twitter, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ranga" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:url" content="https://ranga-sn.vercel.app/" />
    <meta property="og:title" content="Ranga — Friperie en ligne & Articles d'occasion au Sénégal" />
    <meta
      property="og:description"
      content="La marketplace sénégalaise de la seconde main : achetez et vendez vos articles d'occasion en toute confiance. Paiement sécurisé, livraison suivie."
    />
    <meta property="og:image" content="https://ranga-sn.vercel.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ranga — marketplace seconde main au Sénégal" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ranga — Friperie en ligne & Articles d'occasion au Sénégal" />
    <meta
      name="twitter:description"
      content="Achetez et vendez vos articles d'occasion au Sénégal en toute confiance. Paiement sécurisé, livraison suivie, vendeurs vérifiés."
    />
    <meta name="twitter:image" content="https://ranga-sn.vercel.app/og-cover.png" />

    <!-- Données structurées : Organization + WebSite (search action) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://ranga-sn.vercel.app/#organization",
            "name": "Ranga",
            "alternateName": ["Ranga Sénégal"],
            "url": "https://ranga-sn.vercel.app/",
            "logo": { "@type": "ImageObject", "contentUrl": "https://ranga-sn.vercel.app/logo.png", "url": "https://ranga-sn.vercel.app/logo.png", "width": 512, "height": 512 },
            "image": "https://ranga-sn.vercel.app/logo.png",
            "slogan": "Donnez une seconde vie à ce qui vous ressemble.",
            "areaServed": { "@type": "Country", "name": "Sénégal" },
            "description": "Marketplace sénégalaise de la seconde main : achat et vente d'articles d'occasion en toute confiance."
          },
          {
            "@type": "WebSite",
            "@id": "https://ranga-sn.vercel.app/#website",
            "url": "https://ranga-sn.vercel.app/",
            "name": "Ranga",
            "alternateName": "Ranga",
            "inLanguage": "fr",
            "publisher": { "@id": "https://ranga-sn.vercel.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://ranga-sn.vercel.app/shop?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Thème clair/sombre appliqué AVANT le premier rendu (anti-flash).
         Fichier EXTERNE : la CSP `script-src 'self'` interdit l'inline.
         Défaut = SOMBRE (« Burgundy Night ») ; seul un choix explicite
         "light" repasse en clair. Clé de persistance : "rv:theme". -->
    <script src="/theme-init.js"></script>

    <!-- Favicons RANGA (DA §2) : SVG 32 prioritaire, ICO 16/32 en repli. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#11100F" />

    <!-- Token CSRF pour les requêtes mutantes (POST/PATCH/DELETE). -->
    <meta name="csrf-token" content="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
