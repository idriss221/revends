<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Sok2t5JNg8uIAJtdyF1O56INwX5xrdQuV7eXxcINv6w" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ==================================================================
         SEO — ReVends / ReVendsen (marketplace seconde main, Sénégal)
         Objectif : être visible sur « revends » et « revendsen » + les
         requêtes friperie / articles d'occasion. On CONSERVE le canonical
         de production (revends.vercel.app) : un canonical vers vercel.app
         ferait indexer le domaine Vercel à la place du site.
         ================================================================== -->
    <title>ReVendsen (ReVends) — Friperie en ligne & Articles d'occasion au Sénégal</title>
    <meta
      name="description"
      content="ReVendsen (ReVends) : la friperie en ligne sénégalaise. Achetez et vendez des articles d'occasion — vêtements, téléphones, chaussures — en toute confiance. Paiement sécurisé, livraison suivie, vendeurs vérifiés."
    />
    <meta
      name="keywords"
      content="revends, revendsen, re vends, revendsen sénégal, revends sénégal, friperie en ligne, friperie sénégal, articles d'occasion, seconde main sénégal, marketplace sénégal, vendre en ligne sénégal, acheter pas cher sénégal"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="ReVendsen" />
    <link rel="canonical" href="https://revends.vercel.app/" />

    <!-- Open Graph (Facebook, X/Twitter, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReVendsen" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:url" content="https://revends.vercel.app/" />
    <meta property="og:title" content="ReVendsen (ReVends) — Friperie en ligne & Articles d'occasion au Sénégal" />
    <meta
      property="og:description"
      content="La marketplace sénégalaise de la seconde main : achetez et vendez vos articles d'occasion en toute confiance. Paiement sécurisé, livraison suivie."
    />
    <meta property="og:image" content="https://revends.vercel.app/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ReVends — friperie en ligne au Sénégal" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReVendsen (ReVends) — Friperie en ligne & Articles d'occasion au Sénégal" />
    <meta
      name="twitter:description"
      content="Achetez et vendez vos articles d'occasion au Sénégal en toute confiance. Paiement sécurisé, livraison suivie, vendeurs vérifiés."
    />
    <meta name="twitter:image" content="https://revends.vercel.app/og-cover.jpg" />
    <meta name="twitter:image:alt" content="ReVends — friperie en ligne au Sénégal" />

    <!-- Données structurées : Organization + WebSite (search action) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://revends.vercel.app/#organization",
            "name": "ReVendsen",
            "alternateName": ["ReVends", "ReVendsen Sénégal"],
            "url": "https://revends.vercel.app/",
            "logo": "https://revends.vercel.app/logo.png",
            "areaServed": { "@type": "Country", "name": "Sénégal" },
            "description": "Marketplace sénégalaise de la seconde main : achat et vente d'articles d'occasion en toute confiance."
          },
          {
            "@type": "WebSite",
            "@id": "https://revends.vercel.app/#website",
            "url": "https://revends.vercel.app/",
            "name": "ReVendsen",
            "alternateName": ["ReVends", "ReVendsen Sénégal"],
            "inLanguage": "fr",
            "publisher": { "@id": "https://revends.vercel.app/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://revends.vercel.app/shop?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Thème clair/sombre appliqué AVANT le premier rendu (anti-flash).
         Fichier EXTERNE : la CSP `script-src 'self'` interdit l'inline.
         Défaut = SOMBRE (« Burgundy Night ») ; seul un choix explicite
         "light" repasse en clair. Clé de persistance : "rv:theme". -->
    <script src="/theme-init.js"></script>

    <!-- Favicons REVENDS (DA §2) :
         SVG 32 prioritaire ; PNG **96×96 / 192×192** (multiples de 48, exigence
         Google pour le site name / rich results) ; ICO 16/32 en repli ;
         apple-touch-icon 180×180 pour iOS. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#11100F" />
    <meta name="application-name" content="ReVendsen" />
    <meta name="apple-mobile-web-app-title" content="ReVendsen" />

    <!-- Token CSRF pour les requêtes mutantes (POST/PATCH/DELETE). -->
    <meta name="csrf-token" content="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
