
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Sok2t5JNg8uIAJtdyF1O56INwX5xrdQuV7eXxcINv6w" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- SEO Classique pour monter sur Google -->
    <title>ReVendsen | Friperie en Ligne & Vêtements d'Occasion Pas Cher</title>
    <meta
      name="description"
      content="ReVendsen — La meilleure friperie en ligne pour acheter et vendre vos vêtements et articles d'occasion. Paiement sécurisé, livraison suivie et vendeurs vérifiés !"
    />
    <meta name="keywords" content="ReVendsen, revends, friperie en ligne, vetements occasion, seconde main, acheter pas cher, vendre ses vetements, vinted alternative" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Pour être à la une sur Facebook, X/Twitter, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vercel.app" />
    <meta property="og:title" content="ReVendsen | Friperie en Ligne & Vêtements d'Occasion" />
    <meta property="og:description" content="Achetez et vendez vos articles de seconde main en toute confiance. Paiement 100% sécurisé et livraison rapide." />
    <meta property="og:image" content="https://vercel.appapple-touch-icon.png" />

    <!-- Thème clair/sombre appliqué AVANT le premier rendu (anti-flash) -->
    <script>
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('rv:theme')
        } catch (e) {}
        var mode = t === 'light' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', mode)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', mode === 'dark' ? '#11100F' : '#FFFFFF')
      })()
    </script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#11100F" />
    <meta name="csrf-token" content="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
