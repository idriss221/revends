# REVENDS — Nginx SPA config (Frontend)
# Serves static files, handles hash routing, proxies /api and /uploads to backend

upstream revends_api {
    server 172.30.0.5:4000;
    server 172.30.0.6:4000;
    server 172.30.0.7:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Security headers — IMPORTANT : tout `location` qui déclare son propre
    # `add_header` ANNULE ceux hérités du niveau serveur (règle nginx), ils
    # doivent donc être RECOPIÉS dans chaque location.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP progressive : script-src limité à 'self' + inline (script anti-flash
    # d'index.html) ; tout script injecté depuis une autre origine est bloqué.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    # Assets VERSIONNÉS par hash (Vite /assets/) : cache long sûr.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Scripts vanilla non versionnés : bloc `location ^~ /bureau/` SUPPRIMÉ
    # (l'ancienne interface vanilla a été retirée du build).

    # index.html référence des bundles hashés : ne jamais le cacher.
    # (Un add_header local annule l'héritage du niveau serveur → on recopie.)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    # Autres assets (images, polices) : cache long.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # API proxy
    location /api/ {
        proxy_pass http://revends_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass http://revends_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: all other routes -> index.html (hash routing handled by vanilla app.js)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (not proxied)
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}